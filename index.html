<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Neco Lab's simple GitHub to Cloudflare auto deployment test.">
  <meta name="theme-color" content="#0b0f10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300A3A3'/%3E%3C/svg%3E">
  <title>Neco Lab Web Test</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0f10;
      --surface: #101718;
      --white: #ffffff;
      --muted: #a8b8b9;
      --turquoise: #00A3A3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background: var(--background);
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 52rem;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 5vw, 4rem);
      border: 1px solid #293a3c;
      border-radius: 1.5rem;
      background: var(--surface);
      text-align: center;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .eyebrow {
      margin: 0 0 1.75rem;
      color: var(--turquoise);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4rem);
      line-height: 1.15;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    .pipeline {
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      text-wrap: balance;
    }

    .pipeline span { color: var(--turquoise); }

    .divider {
      width: 3rem;
      height: 2px;
      margin: 2rem auto;
      background: var(--turquoise);
    }

    .success {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      max-width: 100%;
      margin: 0;
      padding: 0.75rem 1rem;
      border: 1px solid #215152;
      border-radius: 0.75rem;
      background: #0d2425;
      font-size: clamp(0.85rem, 2vw, 1rem);
      overflow-wrap: anywhere;
    }

    .success::before {
      content: "";
      flex: 0 0 0.45rem;
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--turquoise);
    }

    .connection {
      margin-top: 1.5rem;
      padding: 1.25rem 1rem;
      border: 1px solid #293a3c;
      border-radius: 0.75rem;
      overflow-wrap: anywhere;
    }

    .connection p { margin: 0; }

    #connection-status { font-weight: 600; }

    #connection-message {
      margin-top: 0.5rem;
      color: var(--muted);
    }

    .connection[data-state="ok"] { border-color: var(--turquoise); }
    .connection[data-state="ok"] #connection-status { color: var(--turquoise); }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      main:hover {
        border-color: var(--turquoise);
        box-shadow: 0 0 2.5rem #00a3a312;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <p class="eyebrow">Neco Tools Design Lab</p>
    <h1 id="page-title">Neco Lab Web Test</h1>
    <p class="pipeline">GitHub <span>→</span> Cloudflare Auto Deploy</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="success">Deployment pipeline is working! 🚀</p>
    <section class="connection" data-state="loading" aria-label="Supabase connection test" role="status" aria-live="polite" aria-atomic="true">
      <p id="connection-status">Connecting to Supabase...</p>
      <p id="connection-message"></p>
    </section>
    <noscript><p>Enable JavaScript to run the Supabase connection test.</p></noscript>
    <footer>A small page. A connected workflow.</footer>
  </main>
  <script>
    // This public client key is intentionally visible. Table grants and RLS restrict access.
    const supabaseUrl = 'https://iglsnksguflhhoqubzfp.supabase.co';
    const supabasePublishableKey = 'sb_publishable_3a3ZFGvVhtmFE1hYUvMwog_OHRdmuff';
    const connection = document.querySelector('.connection');
    const connectionStatus = document.querySelector('#connection-status');
    const connectionMessage = document.querySelector('#connection-message');

    async function testSupabaseConnection() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);

      try {
        const response = await fetch(
          `${supabaseUrl}/rest/v1/cloudflare_test?select=id,message&id=eq.1&limit=1`,
          {
            headers: { apikey: supabasePublishableKey, Accept: 'application/json' },
            credentials: 'omit',
            cache: 'no-store',
            signal: controller.signal
          }
        );

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const rows = await response.json();
        if (!Array.isArray(rows) || rows.length !== 1 ||
            String(rows[0]?.id) !== '1' || typeof rows[0]?.message !== 'string') {
          throw new Error('Test row not found or invalid.');
        }

        connection.dataset.state = 'ok';
        connectionStatus.textContent = 'Supabase connection: OK';
        connectionMessage.textContent = rows[0].message;
      } catch (error) {
        connection.dataset.state = 'error';
        connectionStatus.textContent = 'Supabase connection: ERROR';
        connectionMessage.textContent = error.name === 'AbortError'
          ? 'Request timed out.'
          : error instanceof TypeError ? 'Unable to reach Supabase.' : error.message;
      } finally {
        clearTimeout(timeout);
      }
    }

    testSupabaseConnection();
  </script>
</body>
</html>
